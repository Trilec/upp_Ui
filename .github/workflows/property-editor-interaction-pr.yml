name: Run PropertyEditor interaction correction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'assistant/property-editor-interaction-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/property-editor-interaction-fix
          fetch-depth: 0
      - name: Apply and verify focused correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              write(path, text.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}')
              write(path, text.replace(old, new))

          # First activation is one complete command. Never inspect the old node
          # pointer after that command has mutated the document.
          path = 'Utilities/UiDesigner/Services/UiDesignerSessionExtensions.cpp'
          text = read(path)
          fn = text.index('bool UiDesignerSession::SetThemeOverrideActive')
          start = text.index('    const UiDesignerChangeImpact impact =', fn)
          end = text.index('    error.Clear();', start) + len('    error.Clear();')
          body = '\n'.join([
              '    const UiDesignerChangeImpact impact =',
              '        (UiDesignerChangeImpact)(dword)override_spec->impact;',
              '    const UiDesignerNodeId node_id = node->id;',
              '    const bool active_now = node->theme_overrides.Find(property) >= 0 &&',
              '                            node->IsThemeOverrideActive(property);',
              '    const bool saved_now = node->theme_override_saved.Find(property) >= 0;',
              '',
              '    if(active != active_now) {',
              '        if(active) {',
              '            if(saved_now) {',
              '                if(!commands_.SetThemeOverrideActive(',
              '                       node_id, property, true, impact,',
              '                       "Activate theme " + property)) {',
              '                    error = commands_.GetLastError();',
              '                    return false;',
              '                }',
              '            }',
              '            else {',
              '                const Value seed = ResolveThemeOverrideValue(*node, *override_spec);',
              '                if(!commands_.SetThemeOverride(',
              '                       node_id, property, seed, impact,',
              '                       "Activate theme " + property)) {',
              '                    error = commands_.GetLastError();',
              '                    return false;',
              '                }',
              '            }',
              '        }',
              '        else if(!commands_.SetThemeOverrideActive(',
              '                    node_id, property, false, impact,',
              '                    "Use theme for " + property)) {',
              '            error = commands_.GetLastError();',
              '            return false;',
              '        }',
              '    }',
              '',
              '    overlay_.Remove(node_id, UiDesignerTransientValueKind::ThemeOverride,',
              '                    property);',
              '    RebuildThemeOverrideModel();',
              '    error.Clear();',
          ])
          write(path, text[:start] + body + text[end:])

          # Override actions are independent from value-editor availability.
          path = 'Utilities/PropertyEditor/PropertyEditorInteraction.cpp'
          text = read(path)
          text, n1 = re.subn(
              r'if\(!item\.overrideable\s*\|\|\s*!item\.enabled\s*\|\|\s*item\.read_only\)',
              'if(!item.overrideable || item.read_only)', text, count=1)
          text, n2 = re.subn(
              r'if\(item\.overrideable\s*&&\s*!item\.override_active\s*&&\s*!item\.value_editable\)',
              'if(item.overrideable && !item.override_active)', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('PropertyEditorInteraction.cpp: override shape changed')
          write(path, text)

          # Boolean values are always live one-click controls when editable.
          replace_once(
              'Utilities/PropertyEditor/PropertyEditorInline.cpp',
              '    return (item.kind == PropertyEditorKind::FillRecipe || item.inline_editor) &&\n'
              '           item.value_editable && item.enabled && !item.read_only;',
              '    return (item.kind == PropertyEditorKind::FillRecipe ||\n'
              '            item.kind == PropertyEditorKind::Boolean || item.inline_editor) &&\n'
              '           item.value_editable && item.enabled && !item.read_only;')

          # Inheritance is communicated by the circle and subdued ink; keep the
          # effective value visible instead of replacing it with opaque prose.
          replace_once(
              'Utilities/PropertyEditor/PropertyEditorPaint.cpp',
              '    if(item.inherited) {\n'
              '        w.DrawText(value_rect.left, y, "Using theme", font, ink);\n'
              '        return;\n'
              '    }\n\n', '')
          replace_once(
              'Utilities/PropertyEditor/PropertyEditorPaint.cpp',
              '    if(item.inherited)\n'
              '        return "Using theme";\n\n', '')

          # Make the numeric/slider action visually legible.
          replace_once(
              'Utilities/PropertyEditor/PropertyAdvancedEditors.cpp',
              '        toggle_.SetIcon(ICON_DESIGN_SLIDERS_48())\n'
              '               .SetIconSize(DPI(16), DPI(16));',
              '        toggle_.SetIcon(ICON_DESIGN_SLIDERS_48())\n'
              '               .SetIconSize(DPI(20), DPI(20))\n'
              '               .SetContentInset(DPI(1));')
          replace_once(
              'Utilities/PropertyEditor/PropertyAdvancedEditors.cpp',
              '        const int toggle_width = toggle_.IsShown() ? DPI(26) : 0;',
              '        const int toggle_width = toggle_.IsShown() ? DPI(30) : 0;')
          replace_count(
              'Utilities/PropertyEditor/PropertyValueEditors.cpp',
              'toggle_.SetIcon(ICON_DESIGN_SLIDERS_48()).SetIconSize(DPI(16), DPI(16));',
              'toggle_.SetIcon(ICON_DESIGN_SLIDERS_48())\n'
              '               .SetIconSize(DPI(20), DPI(20))\n'
              '               .SetContentInset(DPI(1));', 2)
          replace_count(
              'Utilities/PropertyEditor/PropertyValueEditors.cpp',
              'const int toggle_width = toggle_.IsShown() ? DPI(26) : 0;',
              'const int toggle_width = toggle_.IsShown() ? DPI(30) : 0;', 2)

          # Member names have no live visual projection. Avoid a Preview pass on
          # every keystroke and commit the rename once editing settles.
          replace_once(
              'Utilities/UiDesigner/Services/UiDesignerSession.cpp',
              '    const UiDesignerPropertySpec* property_spec = nullptr;\n'
              '    if(!SelectionSupports(property, &property_spec)) {\n'
              '        error = "Selection does not support " + property;\n'
              '        return false;\n'
              '    }\n\n'
              '    for(UiDesignerNodeId id : state_.selection.nodes) {',
              '    const UiDesignerPropertySpec* property_spec = nullptr;\n'
              '    if(!SelectionSupports(property, &property_spec)) {\n'
              '        error = "Selection does not support " + property;\n'
              '        return false;\n'
              '    }\n\n'
              '    if(property == "name") {\n'
              '        error.Clear();\n'
              '        return true;\n'
              '    }\n\n'
              '    for(UiDesignerNodeId id : state_.selection.nodes) {')

          # Present General first while preserving canonical order inside groups.
          path = 'Utilities/UiDesigner/Services/UiDesignerSession.cpp'
          text = read(path)
          fn = text.index('void UiDesignerSession::RebuildThemeOverrideModel')
          loop = text.index('    for(const UiDesignerThemeOverrideSpec& property : spec->theme_overrides) {', fn)
          loop_end = text.index('    theme_override_model_.StructureChanged();', loop)
          new_loop = '\n'.join([
              '    const auto AddOverrideRow = [&](const UiDesignerThemeOverrideSpec& property) {',
              '        const int q = node->theme_overrides.Find(property.id);',
              '        const bool inherited = q < 0 || !node->IsThemeOverrideActive(property.id);',
              '        const Value value = inherited',
              '            ? ResolveThemeOverrideValue(*node, property)',
              '            : node->theme_overrides.GetValue(q);',
              '        property.AddTo(theme_override_model_, value, false);',
              '        if(PropertyEditorItem *item = theme_override_model_.Find(property.id)) {',
              '            item->SetInherited(inherited);',
              '            item->overrideable = true;',
              '            item->override_active = !inherited;',
              '            item->enabled = true;',
              '            item->value_editable = !inherited;',
              '        }',
              '    };',
              '    for(const UiDesignerThemeOverrideSpec& property : spec->theme_overrides)',
              '        if(property.group == "General")',
              '            AddOverrideRow(property);',
              '    for(const UiDesignerThemeOverrideSpec& property : spec->theme_overrides)',
              '        if(property.group != "General")',
              '            AddOverrideRow(property);',
              '',
          ])
          write(path, text[:loop] + new_loop + text[loop_end:])

          # Put Overrides ahead of Data and rebuild editors after activation.
          replace_once(
              'Utilities/UiDesigner/UiDesigner/UiDesignerWindow.cpp',
              '                   .AddSection("Inspector", ICON_DESIGN_TUNE_48(), inspector_)\n'
              '                   .AddSection("Data", ICON_EDITOR_FORMAT_LIST_BULLETED_48(), data_panel_,\n'
              '                               "Edit the selected control’s data")\n'
              '                   .AddSection("Theme Overrides", ICON_DESIGN_FORMAT_PAINT_48(), overrides_shell_)\n'
              '                   .AddSection("Events & Actions", ICON_DESIGN_DYNAMIC_FORM_48(), behaviors_)',
              '                   .AddSection("Inspector", ICON_DESIGN_TUNE_48(), inspector_)\n'
              '                   .AddSection("Theme Overrides", ICON_DESIGN_FORMAT_PAINT_48(), overrides_shell_)\n'
              '                   .AddSection("Data", ICON_EDITOR_FORMAT_LIST_BULLETED_48(), data_panel_,\n'
              '                               "Edit the selected control’s data")\n'
              '                   .AddSection("Events & Actions", ICON_DESIGN_DYNAMIC_FORM_48(), behaviors_)')
          replace_once(
              'Utilities/UiDesigner/UiDesigner/UiDesignerWindow.cpp',
              '            overrides_.Refresh();\n'
              '            preview_canvas_.Refresh();',
              '            overrides_.RefreshModel();\n'
              '            preview_canvas_.Refresh();')

          # Regression proof: action rail works independently of editor state.
          replace_once(
              'Utilities/PropertyEditorTests/main.cpp',
              '    override_model.Find("surface")->override_active = false;\n'
              '    override_model.Find("surface")->inherited = true;\n'
              '    override_model.Find("surface")->value_editable = false;\n'
              '    int mouse_requests = 0;',
              '    override_model.Find("surface")->override_active = false;\n'
              '    override_model.Find("surface")->inherited = true;\n'
              '    override_model.Find("surface")->value_editable = false;\n'
              '    override_model.Find("surface")->enabled = false;\n'
              '    int mouse_requests = 0;')
          replace_once(
              'Utilities/UiDesigner/Tests/main.cpp',
              '    Check(panel_override_session.ThemeOverrideModel().Find("radius") &&\n'
              '              panel_override_session.ThemeOverrideModel().Find("radius")->override_active &&\n'
              '              panel_override_session.ThemeOverrideModel().Find("radius")->value_editable &&\n'
              '              panel_override_session.Document().GetThemeOverride(\n'
              '                  panel_override_node, "radius").Is<int>(),\n'
              '          "Panel Radius becomes an editable local numeric value");',
              '    Check(panel_override_session.ThemeOverrideModel().Find("radius") &&\n'
              '              panel_override_session.ThemeOverrideModel().Find("radius")->override_active &&\n'
              '              panel_override_session.ThemeOverrideModel().Find("radius")->value_editable &&\n'
              '              panel_override_session.Document().GetThemeOverride(\n'
              '                  panel_override_node, "radius").Is<int>(),\n'
              '          "Panel Radius becomes an editable local numeric value");\n'
              '    Check(panel_override_session.SetThemeOverrideActive("radius", false,\n'
              '                                                        panel_override_error) &&\n'
              '              !panel_override_session.Document().Find(panel_override_node)\n'
              '                   ->IsThemeOverrideActive("radius"),\n'
              '          "Panel Radius can return to inherited state: " + panel_override_error);\n'
              '    Check(panel_override_session.SetThemeOverrideActive("radius", true,\n'
              '                                                        panel_override_error) &&\n'
              '              panel_override_session.Document().Find(panel_override_node)\n'
              '                   ->IsThemeOverrideActive("radius"),\n'
              '          "Panel Radius restores saved state after first activation: " +\n'
              '              panel_override_error);\n'
              '    Check(panel_override_session.ThemeOverrideModel().GetCount() > 0 &&\n'
              '              panel_override_session.ThemeOverrideModel()[0].group == "General",\n'
              '          "Panel Theme Overrides present General first");')

          Path('.github/workflows/property-editor-interaction-fix.yml').unlink()
          Path('.github/workflows/property-editor-interaction-pr.yml').unlink()
          PY
          git diff --check
          git status --short
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PropertyEditor makes inherited controls immediately usable" -m "Fix first theme-override activation so it never reads a stale document node after seeding the authored value. Keep override actions independent from value-editor availability, give Boolean values direct inline interaction, and show effective inherited values." -m "Move General and Theme Overrides forward, enlarge numeric slider actions, and avoid unnecessary Preview work while renaming controls. Add focused interaction and session regression coverage."
          git push origin HEAD:assistant/property-editor-interaction-fix
