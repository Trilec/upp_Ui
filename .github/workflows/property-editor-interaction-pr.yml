name: Run PropertyEditor interaction correction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'assistant/property-editor-interaction-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/property-editor-interaction-fix
          fetch-depth: 0
      - name: Execute guarded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          session_path = Path('Utilities/UiDesigner/Services/UiDesignerSessionExtensions.cpp')
          session = session_path.read_text(encoding='utf-8')
          function_start = session.index('bool UiDesignerSession::SetThemeOverrideActive')
          body_start = session.index('    const UiDesignerChangeImpact impact =', function_start)
          body_end = session.index('    error.Clear();', body_start) + len('    error.Clear();')
          replacement = '\n'.join([
              '    const UiDesignerChangeImpact impact =',
              '        (UiDesignerChangeImpact)(dword)override_spec->impact;',
              '    const UiDesignerNodeId node_id = node->id;',
              '    const bool active_now = node->theme_overrides.Find(property) >= 0 &&',
              '                            node->IsThemeOverrideActive(property);',
              '    const bool saved_now = node->theme_override_saved.Find(property) >= 0;',
              '',
              '    if(active != active_now) {',
              '        if(active) {',
              '            if(saved_now) {',
              '                if(!commands_.SetThemeOverrideActive(',
              '                       node_id, property, true, impact,',
              '                       "Activate theme " + property)) {',
              '                    error = commands_.GetLastError();',
              '                    return false;',
              '                }',
              '            }',
              '            else {',
              '                // SetThemeOverride is the complete first-activation command:',
              '                // it seeds the resolved value and leaves it active. Do not',
              '                // continue through a stale node pointer after document mutation.',
              '                const Value seed = ResolveThemeOverrideValue(*node, *override_spec);',
              '                if(!commands_.SetThemeOverride(',
              '                       node_id, property, seed, impact,',
              '                       "Activate theme " + property)) {',
              '                    error = commands_.GetLastError();',
              '                    return false;',
              '                }',
              '            }',
              '        }',
              '        else if(!commands_.SetThemeOverrideActive(',
              '                    node_id, property, false, impact,',
              '                    "Use theme for " + property)) {',
              '            error = commands_.GetLastError();',
              '            return false;',
              '        }',
              '    }',
              '',
              '    overlay_.Remove(node_id, UiDesignerTransientValueKind::ThemeOverride,',
              '                    property);',
              '    RebuildThemeOverrideModel();',
              '    error.Clear();',
          ])
          session_path.write_text(session[:body_start] + replacement + session[body_end:],
                                  encoding='utf-8')

          interaction_path = Path('Utilities/PropertyEditor/PropertyEditorInteraction.cpp')
          interaction = interaction_path.read_text(encoding='utf-8')
          old_guard = '    if(!item.overrideable || !item.enabled || item.read_only)\n        return;'
          old_inherited = '''    if(item.overrideable && !item.override_active && !item.value_editable) {
              ToggleOverride(row);
              return;
          }'''
          if interaction.count(old_guard) != 1 or interaction.count(old_inherited) != 1:
              raise SystemExit('PropertyEditorInteraction.cpp: unexpected override interaction shape')
          interaction = interaction.replace(
              old_guard,
              '    if(!item.overrideable || item.read_only)\n        return;', 1)
          interaction = interaction.replace(
              old_inherited,
              '''    if(item.overrideable && !item.override_active) {
              ToggleOverride(row);
              return;
          }''', 1)
          interaction_path.write_text(interaction, encoding='utf-8')

          source = Path('.github/workflows/property-editor-interaction-fix.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          lines = [line[10:] if line.startswith('          ') else line
                   for line in source[start:end].splitlines()]
          script = '\n'.join(lines)

          def remove_replace_once(script, path):
              start = script.index("replace_once(\n    '" + path + "'")
              candidates = [p for p in (
                  script.find('\n\nreplace_once(', start + 1),
                  script.find('\n\nreplace_count(', start + 1)) if p >= 0]
              if not candidates:
                  raise SystemExit('unable to isolate replacement for ' + path)
              end = min(candidates)
              return script[:start] + script[end + 2:]

          script = remove_replace_once(
              script, 'Utilities/UiDesigner/Services/UiDesignerSessionExtensions.cpp')
          script = remove_replace_once(
              script, 'Utilities/PropertyEditor/PropertyEditorInteraction.cpp')
          script = remove_replace_once(
              script, 'Utilities/PropertyEditor/PropertyEditorInteraction.cpp')
          exec(compile(script, 'property-editor-interaction-fix', 'exec'))
          Path('.github/workflows/property-editor-interaction-pr.yml').unlink()
          PY
          git diff --check
          git status --short
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PropertyEditor makes inherited controls immediately usable" -m "Fix first theme-override activation so it never reads a stale document node after seeding the authored value. Keep override actions independent from value-editor availability, give Boolean values direct inline interaction, and show effective inherited values." -m "Move General and Theme Overrides forward, enlarge numeric slider actions, and avoid unnecessary Preview work while renaming controls. Add focused interaction and session regression coverage."
          git push origin HEAD:assistant/property-editor-interaction-fix
