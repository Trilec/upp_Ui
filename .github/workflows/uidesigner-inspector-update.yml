name: Publish UiDesigner semantic inspector update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/uidesigner-inspector-update.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply verified source migration
        shell: bash
        run: |
          mkdir -p Utilities/UiDesigner/tools
          base64 -d .github/uidesigner-inspector-update.py.gz.b64 | gzip -d > Utilities/UiDesigner/tools/apply_inspector_update.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Utilities/UiDesigner/tools/apply_inspector_update.py')
          s = p.read_text()
          s = s.replace("ROOT = Path(__file__).resolve().parents[3] if '__file__' in globals() else Path.cwd()\n", "ROOT = Path(__file__).resolve().parents[3] if '__file__' in globals() else Path.cwd()\nMISMATCHES = []\n")
          s = s.replace("def replace_once(text, old, new, label):\n    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f'{label}: expected one match, found {count}')\n    return text.replace(old, new, 1)\n", "def replace_once(text, old, new, label):\n    count = text.count(old)\n    if count != 1:\n        message = f'{label}: expected one match, found {count}'\n        print('MISMATCH:', message)\n        MISMATCHES.append(message)\n        return text\n    return text.replace(old, new, 1)\n")
          s = s.replace("def require(text, needle, label):\n    if needle not in text:\n        raise RuntimeError(f'{label}: required text not found')\n", "def require(text, needle, label):\n    if needle not in text:\n        message = f'{label}: required text not found: {needle}'\n        print('MISMATCH:', message)\n        MISMATCHES.append(message)\n")
          old = """rel = 'Utilities/UiDesigner/Catalog/Catalog.upp'\ntext = read(rel)\nif '\\tUi;' not in text and '\\n\\tUi;' not in text:\n    text = replace_once(text, 'uses\\n\\tDraw,', 'uses\\n\\tDraw,\\n\\tUi,', 'Catalog.upp Ui dependency')\nif 'UiDesignerInspectorCatalog.cpp' not in text:\n    text = replace_once(text, 'UiDesignerBuiltins.cpp;',\n                        'UiDesignerBuiltins.cpp,\\n\\tUiDesignerInspectorCatalog.cpp;',\n                        'Catalog.upp organizer source')\nwrite(rel, text)\n"""
          new = """rel = 'Utilities/UiDesigner/Catalog/Catalog.upp'\ntext = read(rel)\nif not re.search(r'(?m)^\\s*Ui,?$', text):\n    text, count = re.subn(r'(?m)^(\\s*)Draw,\\s*$', r'\\1Draw,\\n\\1Ui,', text, count=1)\n    if count != 1:\n        message = f'Catalog.upp Ui dependency: expected one Draw dependency, found {count}'\n        print('MISMATCH:', message)\n        MISMATCHES.append(message)\nif 'UiDesignerInspectorCatalog.cpp' not in text:\n    text, count = re.subn(r'(?m)^(\\s*)UiDesignerBuiltins\\.cpp,\\s*$', r'\\1UiDesignerBuiltins.cpp,\\n\\1UiDesignerInspectorCatalog.cpp,', text, count=1)\n    if count != 1:\n        message = f'Catalog.upp organizer source: expected one builtins source, found {count}'\n        print('MISMATCH:', message)\n        MISMATCHES.append(message)\nwrite(rel, text)\n"""
          if old not in s:
              raise RuntimeError('publisher could not patch Catalog.upp block')
          s = s.replace(old, new)
          s = s.replace("print('UiDesigner inspector/content migration applied successfully.')\n", "if MISMATCHES:\n    raise RuntimeError('Migration pattern mismatches:\\n' + '\\n'.join(MISMATCHES))\nprint('UiDesigner inspector/content migration applied successfully.')\n")
          p.write_text(s)
          PY
          python3 Utilities/UiDesigner/tools/apply_inspector_update.py

      - name: Verify and publish source
        shell: bash
        run: |
          rm -rf Utilities/UiDesigner/tools
          rm -f .github/uidesigner-inspector-update.py.gz.b64
          rm -f .github/workflows/uidesigner-inspector-update.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git diff --check
          test -f Utilities/UiDesigner/Catalog/UiDesignerInspectorCatalog.cpp
          grep -q "UiIconCatalog()" Utilities/UiDesigner/Catalog/UiDesignerInspectorCatalog.cpp
          grep -q "SemanticAccordionSection" Utilities/UiDesigner/Theme/UiDesignerThemeAdapter.cpp
          grep -q "SetTabDraggable" Utilities/UiDesigner/CodeGen/UiDesignerCodeGen.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UiDesigner exposes semantic content and complete icon catalog"
          git push origin HEAD:main
