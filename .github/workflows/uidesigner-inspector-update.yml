name: Apply UiDesigner semantic inspector update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/uidesigner-inspector-update.yml

permissions:
  contents: write

concurrency:
  group: uidesigner-semantic-inspector-update
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact source migration
        shell: bash
        run: |
          base64 -d .github/uidesigner-inspector-update.py.gz.b64 | gzip -d > /tmp/apply_inspector_update.py
          python3 /tmp/apply_inspector_update.py

      - name: Commit published source
        shell: bash
        run: |
          rm -f .github/uidesigner-inspector-update.py.gz.b64
          rm -f .github/workflows/uidesigner-inspector-update.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UiDesigner exposes semantic content and complete icon catalog"
          git push origin HEAD:main
