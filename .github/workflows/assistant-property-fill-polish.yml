name: Assistant property fill correction

on:
  push:
    branches:
      - assistant/property-fill-polish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/property-fill-polish
          fetch-depth: 0

      - name: Apply compact fill editor correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, pattern, replacement, label, flags=re.S):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected one replacement, got {count}')
              return updated

          value_path = Path('Utilities/PropertyEditor/PropertyValueEditors.cpp')
          value = value_path.read_text(encoding='utf-8-sig')

          color_block = r'''class PropertyColorSwatchCtrl : public Ctrl {
          public:
              typedef PropertyColorSwatchCtrl CLASSNAME;

              PropertyColorSwatchCtrl()
              {
                  Transparent();
                  WantFocus();
              }

              PropertyColorSwatchCtrl& SetColor(Color color, bool mixed = false)
              {
                  color_ = color;
                  mixed_ = mixed;
                  Tip(mixed ? "Multiple colours" :
                      Format("#%02X%02X%02X", color.GetR(), color.GetG(), color.GetB()));
                  Refresh();
                  return *this;
              }

              Event<> WhenAction;

              void Paint(Draw& w) override
              {
                  const Size size = GetSize();
                  const int diameter = min(DPI(16), max(0, min(size.cx, size.cy) - DPI(4)));
                  if(diameter <= 0)
                      return;
                  const Rect dot = RectC((size.cx - diameter) / 2,
                                         (size.cy - diameter) / 2,
                                         diameter, diameter);
                  Color fill = mixed_ ? SColorDisabled() : color_;
                  if(!IsEnabled())
                      fill = Blend(fill, SColorFace(), 110);
                  w.DrawEllipse(dot, fill, 1,
                                HasFocus() ? SColorHighlight() : SColorShadow());
              }

              void LeftDown(Point, dword) override
              {
                  if(!IsEnabled())
                      return;
                  SetFocus();
                  WhenAction();
              }

              bool Key(dword key, int count) override
              {
                  if(IsEnabled() && (key == K_ENTER || key == K_SPACE)) {
                      WhenAction();
                      return true;
                  }
                  return Ctrl::Key(key, count);
              }

          private:
              Color color_ = Color(128, 128, 128);
              bool mixed_ = false;
          };

          class PropertyColorValueEditor : public PropertyValueEditor {
          public:
              PropertyColorValueEditor()
              {
                  Add(swatch_);
                  swatch_.WhenAction = [=] { OpenColorDialog(); };
              }

              void Configure(const PropertyEditorItem& item) override
              {
                  swatch_.Enable(item.enabled && !item.read_only);
              }

              void SetEditorValue(const Value& value, bool mixed) override
              {
                  mixed_ = mixed;
                  value_ = mixed || IsNull(value) ? Value(Color(128, 128, 128)) : value;
                  swatch_.SetColor(Color(value_), mixed_);
              }

              Value GetEditorValue() const override
              {
                  return mixed_ ? Value(Null) : value_;
              }

              void FocusEditor() override
              {
                  swatch_.SetFocus();
              }

              void Layout() override
              {
                  swatch_.SetRect(0, 0, min(DPI(28), GetSize().cx), GetSize().cy);
              }

          private:
              void OpenColorDialog()
              {
                  const Color original = Color(value_);
                  Color chosen = original;
                  bool accepted = false;

                  class ColorDialog : public TopWindow {
                  public:
                      UiColorPicker picker;
                      ColorDialog()
                      {
                          Title("Color");
                          Sizeable().Zoomable();
                          SetRect(0, 0, DPI(720), DPI(520));
                          Add(picker.SizePos());
                      }
                  } dlg;

                  dlg.picker.SetColor(original);
                  dlg.picker.WhenChanging = [&] {
                      chosen = dlg.picker.GetColor();
                      swatch_.SetColor(chosen);
                      WhenPreview(chosen);
                  };
                  dlg.picker.WhenAccept = [&] {
                      chosen = dlg.picker.GetColor();
                      accepted = true;
                      dlg.AcceptBreak(IDOK);
                  };
                  dlg.picker.WhenCancel = [&] {
                      accepted = false;
                      dlg.RejectBreak(IDCANCEL);
                  };

                  dlg.CenterOwner();
                  if(dlg.Run() == IDOK && accepted) {
                      value_ = chosen;
                      mixed_ = false;
                      swatch_.SetColor(chosen);
                      WhenCommit(value_);
                  }
                  else {
                      swatch_.SetColor(original, mixed_);
                      WhenPreview(original);
                  }
              }

              PropertyColorSwatchCtrl swatch_;
              Value value_ = Color(128, 128, 128);
              bool mixed_ = false;
          };

          class PropertyFilePathValueEditor'''

          value = replace_once(
              value,
              r'class PropertyColorValueEditor : public PropertyValueEditor \{.*?\n\};\n\nclass PropertyFilePathValueEditor',
              color_block,
              'replace colour editor')

          palette_fill_block = r'''class PropertyColorPaletteValueEditor : public PropertyValueEditor {
          public:
              PropertyColorPaletteValueEditor()
              {
                  for(int i = 0; i < 4; i++) {
                      Add(swatches_[i]);
                      const int index = i;
                      swatches_[i].WhenAction = [=] { OpenColorDialog(index); };
                  }
              }

              void Configure(const PropertyEditorItem& item) override
              {
                  count_ = clamp(item.color_count, 1, 4);
                  enabled_ = item.enabled && !item.read_only;
                  for(int i = 0; i < 4; i++) {
                      swatches_[i].Show(i < count_);
                      swatches_[i].Enable(enabled_ && i < count_);
                  }
                  Layout();
              }

              void SetEditorValue(const Value& value, bool mixed) override
              {
                  mixed_ = mixed;
                  value_.Clear();
                  if(!mixed && value.Is<ValueArray>()) {
                      ValueArray colors = value;
                      for(int i = 0; i < count_; i++)
                          value_.Add(i < colors.GetCount() && colors[i].Is<Color>()
                                         ? Value(colors[i]) : Value(Color(128, 128, 128)));
                  }
                  else {
                      for(int i = 0; i < count_; i++)
                          value_.Add(Color(128, 128, 128));
                  }
                  UpdateSwatches();
              }

              Value GetEditorValue() const override
              {
                  return mixed_ ? Value(Null) : Value(value_);
              }

              void FocusEditor() override
              {
                  if(count_ > 0)
                      swatches_[0].SetFocus();
              }

              void Layout() override
              {
                  const int diameter = min(DPI(20), max(DPI(14), GetSize().cy));
                  const int gap = DPI(3);
                  for(int i = 0; i < count_; i++)
                      swatches_[i].SetRect(i * (diameter + gap), 0,
                                          diameter, GetSize().cy);
              }

          private:
              void UpdateSwatches()
              {
                  for(int i = 0; i < count_; i++)
                      swatches_[i].SetColor(Color(value_[i]), mixed_);
              }

              void OpenColorDialog(int index)
              {
                  if(index < 0 || index >= count_ || mixed_)
                      return;
                  ValueArray original = value_;
                  Color chosen = Color(value_[index]);
                  bool accepted = false;

                  class ColorDialog : public TopWindow {
                  public:
                      UiColorPicker picker;
                      ColorDialog()
                      {
                          Title("Color");
                          Sizeable().Zoomable();
                          SetRect(0, 0, DPI(720), DPI(520));
                          Add(picker.SizePos());
                      }
                  } dlg;

                  dlg.picker.SetColor(chosen);
                  dlg.picker.WhenChanging = [&] {
                      chosen = dlg.picker.GetColor();
                      value_.At(index) = chosen;
                      UpdateSwatches();
                      WhenPreview(value_);
                  };
                  dlg.picker.WhenAccept = [&] {
                      chosen = dlg.picker.GetColor();
                      value_.At(index) = chosen;
                      accepted = true;
                      dlg.AcceptBreak(IDOK);
                  };
                  dlg.picker.WhenCancel = [&] {
                      accepted = false;
                      dlg.RejectBreak(IDCANCEL);
                  };

                  dlg.CenterOwner();
                  if(dlg.Run() == IDOK && accepted) {
                      UpdateSwatches();
                      WhenCommit(value_);
                  }
                  else {
                      value_ = original;
                      UpdateSwatches();
                      WhenPreview(value_);
                  }
              }

              PropertyColorSwatchCtrl swatches_[4];
              ValueArray value_;
              int count_ = 1;
              bool enabled_ = true;
              bool mixed_ = false;
          };

          class PropertyFillRecipeValueEditor : public PropertyValueEditor {
          public:
              PropertyFillRecipeValueEditor()
              {
                  Add(mode_);
                  mode_.SetCustomStyle(UiTheme::ResolveDropdown());
                  mode_.Add(UiDropdown::Item("None", "None", true));
                  mode_.Add(UiDropdown::Item("Solid", "Solid", true));
                  mode_.Add(UiDropdown::Item("Gradient", "QuadGradient", true));
                  mode_.Add(UiDropdown::Item("Image unavailable", "Image", false));
                  mode_.WhenSelectData = [=](const Value& value) {
                      if(syncing_)
                          return;
                      const String next = AsString(value);
                      if(next == "Image")
                          return;
                      const String previous = RecipeText("mode", "None");
                      const Color seed = previous == "Solid"
                          ? RecipeColor("solid", Color(128, 128, 128))
                          : RecipeColor("top_left", Color(128, 128, 128));
                      if(next == "Solid" && recipe_.Find("solid") < 0)
                          recipe_.Set("solid", seed);
                      if(next == "QuadGradient")
                          for(int i = 0; i < 4; i++)
                              if(recipe_.Find(Key(i)) < 0)
                                  recipe_.Set(Key(i), seed);
                      recipe_.Set("mode", next);
                      UpdateVisible();
                      WhenPreview(recipe_);
                      WhenCommit(recipe_);
                  };
                  for(int i = 0; i < 4; i++) {
                      Add(swatches_[i]);
                      const int index = i;
                      swatches_[i].WhenAction = [=] { OpenColorDialog(index); };
                  }
              }

              void Configure(const PropertyEditorItem& item) override
              {
                  enabled_ = item.value_editable && item.enabled && !item.read_only;
                  mode_.Enable(enabled_);
                  for(int i = 0; i < 4; i++)
                      swatches_[i].Enable(enabled_);
                  UpdateVisible();
              }

              void SetEditorValue(const Value& value, bool mixed) override
              {
                  mixed_ = mixed;
                  recipe_ = value.Is<ValueMap>() ? (ValueMap)value : ValueMap();
                  if(recipe_.Find("mode") < 0)
                      recipe_.Set("mode", "None");
                  if(recipe_.Find("solid") < 0)
                      recipe_.Set("solid", Color(128, 128, 128));
                  for(int i = 0; i < 4; i++)
                      if(recipe_.Find(Key(i)) < 0)
                          recipe_.Set(Key(i), RecipeColor("solid", Color(128, 128, 128)));
                  syncing_ = true;
                  mode_.SetDataSilently(RecipeText("mode", "None"));
                  syncing_ = false;
                  UpdateVisible();
              }

              Value GetEditorValue() const override { return recipe_; }

              void FocusEditor() override { mode_.SetFocus(); }

              void Layout() override
              {
                  const String mode = RecipeText("mode", "None");
                  const int count = mode == "QuadGradient" ? 4 : mode == "Solid" ? 1 : 0;
                  const int gap = DPI(3);
                  const int swatch_width = min(DPI(18), max(DPI(14), GetSize().cy - DPI(4)));
                  const int swatch_total = count > 0
                      ? count * swatch_width + (count - 1) * gap : 0;
                  const int inter_gap = count > 0 ? DPI(4) : 0;
                  const int mode_width = min(DPI(88),
                      max(DPI(64), GetSize().cx - swatch_total - inter_gap));
                  mode_.SetRect(0, 0, max(0, min(mode_width, GetSize().cx)), GetSize().cy);
                  int x = min(GetSize().cx, mode_width + inter_gap);
                  for(int i = 0; i < 4; i++) {
                      if(i < count)
                          swatches_[i].SetRect(x + i * (swatch_width + gap), 0,
                                              swatch_width, GetSize().cy);
                      else
                          swatches_[i].SetRect(0, 0, 0, 0);
                  }
              }

          private:
              static String Key(int index)
              {
                  static const char *keys[] = {
                      "top_left", "top_right", "bottom_left", "bottom_right"
                  };
                  return keys[index];
              }

              String RecipeText(const String& key, const String& fallback) const
              {
                  const int q = recipe_.Find(key);
                  return q >= 0 ? AsString(recipe_.GetValue(q)) : fallback;
              }

              Color RecipeColor(const String& key, Color fallback) const
              {
                  const int q = recipe_.Find(key);
                  return q >= 0 && recipe_.GetValue(q).Is<Color>()
                      ? Color(recipe_.GetValue(q)) : fallback;
              }

              void UpdateVisible()
              {
                  const String mode = RecipeText("mode", "None");
                  const int count = mode == "QuadGradient" ? 4 : mode == "Solid" ? 1 : 0;
                  for(int i = 0; i < 4; i++) {
                      swatches_[i].Show(i < count);
                      const String key = mode == "Solid" ? "solid" : Key(i);
                      swatches_[i].SetColor(RecipeColor(key, Color(128, 128, 128)), mixed_);
                  }
                  Layout();
              }

              void OpenColorDialog(int index)
              {
                  const String mode = RecipeText("mode", "None");
                  const int count = mode == "QuadGradient" ? 4 : mode == "Solid" ? 1 : 0;
                  if(!enabled_ || mixed_ || index < 0 || index >= count)
                      return;
                  const String key = mode == "Solid" ? "solid" : Key(index);
                  ValueMap original = recipe_;
                  Color chosen = RecipeColor(key, Color(128, 128, 128));
                  bool accepted = false;

                  class ColorDialog : public TopWindow {
                  public:
                      UiColorPicker picker;
                      ColorDialog()
                      {
                          Title("Fill colour");
                          Sizeable().Zoomable();
                          SetRect(0, 0, DPI(720), DPI(520));
                          Add(picker.SizePos());
                      }
                  } dlg;

                  dlg.picker.SetColor(chosen);
                  dlg.picker.WhenChanging = [&] {
                      recipe_.Set(key, dlg.picker.GetColor());
                      UpdateVisible();
                      WhenPreview(recipe_);
                  };
                  dlg.picker.WhenAccept = [&] {
                      recipe_.Set(key, dlg.picker.GetColor());
                      accepted = true;
                      dlg.AcceptBreak(IDOK);
                  };
                  dlg.picker.WhenCancel = [&] { dlg.RejectBreak(IDCANCEL); };
                  dlg.CenterOwner();
                  if(dlg.Run() == IDOK && accepted)
                      WhenCommit(recipe_);
                  else {
                      recipe_ = original;
                      UpdateVisible();
                      WhenPreview(recipe_);
                  }
              }

              UiDropdown mode_;
              PropertyColorSwatchCtrl swatches_[4];
              ValueMap recipe_;
              bool enabled_ = true;
              bool mixed_ = false;
              bool syncing_ = false;
          };

          class PropertySliderIntValueEditor'''

          value = replace_once(
              value,
              r'class PropertyColorPaletteValueEditor : public PropertyValueEditor \{.*?\n\};\n\nclass PropertyFillRecipeValueEditor : public PropertyValueEditor \{.*?\n\};\n\nclass PropertySliderIntValueEditor',
              palette_fill_block,
              'replace palette and fill editors')
          value_path.write_text(value, encoding='utf-8')

          editor_path = Path('Utilities/PropertyEditor/PropertyEditor.cpp')
          editor = editor_path.read_text(encoding='utf-8-sig')
          draw_block = r'''void PropertyEditor::DrawValueSummary(Draw& w,
                                                    const PropertyEditorItem& item,
                                                    Rect value_rect) const
          {
              Font font = StdFont();
              int y = value_rect.top + (value_rect.GetHeight() - font.GetHeight()) / 2;
              Color ink = item.enabled ? style_.value_ink : style_.disabled_ink;
              if(item.mixed)
                  ink = style_.mixed_ink;
              else if(item.inherited)
                  ink = style_.inherited_ink;

              if(item.inherited) {
                  w.DrawText(value_rect.left, y, "Using theme", font, ink);
                  return;
              }

              const auto DrawSwatch = [&](int x, Color color) {
                  const int diameter = min(DPI(16), max(0, value_rect.GetHeight() - DPI(8)));
                  Rect dot = RectC(x, value_rect.top + (value_rect.GetHeight() - diameter) / 2,
                                   diameter, diameter);
                  if(diameter > 0)
                      w.DrawEllipse(dot, color, 1, style_.frame);
                  return diameter;
              };

              if(item.kind == PropertyEditorKind::FillRecipe &&
                 !item.mixed && item.value.Is<ValueMap>()) {
                  ValueMap recipe = item.value;
                  const auto RecipeValue = [&](const String& key, const Value& fallback) {
                      const int q = recipe.Find(key);
                      return q >= 0 ? recipe.GetValue(q) : fallback;
                  };
                  const String mode = AsString(RecipeValue("mode", "None"));
                  const String label = mode == "QuadGradient" ? "Gradient" :
                                       mode == "Image" ? "Image unavailable" : mode;
                  const int mode_width = min(DPI(88), max(DPI(64),
                      GetTextSize(label, font).cx + DPI(24)));
                  Rect mode_rect(value_rect.left, value_rect.top + DPI(1),
                                 min(value_rect.right, value_rect.left + mode_width),
                                 value_rect.bottom - DPI(1));
                  if(!mode_rect.IsEmpty()) {
                      DrawFrame(w, mode_rect, style_.frame);
                      w.DrawText(mode_rect.left + DPI(6), y, label, font, ink);
                      w.DrawText(max(mode_rect.left + DPI(6), mode_rect.right - DPI(12)),
                                 y, "v", font, ink);
                  }
                  int x = mode_rect.right + DPI(4);
                  static const char *keys[] = {
                      "top_left", "top_right", "bottom_left", "bottom_right"
                  };
                  const int count = mode == "QuadGradient" ? 4 : mode == "Solid" ? 1 : 0;
                  for(int i = 0; i < count; i++) {
                      const String key = mode == "Solid" ? "solid" : keys[i];
                      Value color_value = RecipeValue(key, Color(128, 128, 128));
                      Color color = color_value.Is<Color>()
                          ? Color(color_value) : Color(128, 128, 128);
                      x += DrawSwatch(x, color) + DPI(3);
                  }
                  return;
              }

              if(item.kind == PropertyEditorKind::Color &&
                 !item.mixed && item.value.GetType() == COLOR_V) {
                  DrawSwatch(value_rect.left, Color(item.value));
                  return;
              }

              if(item.kind == PropertyEditorKind::ColorPalette &&
                 !item.mixed && item.value.Is<ValueArray>()) {
                  ValueArray colors = item.value;
                  int x = value_rect.left;
                  const int count = min(4, colors.GetCount());
                  for(int i = 0; i < count; i++) {
                      Color color = colors[i].Is<Color>()
                          ? Color(colors[i]) : Color(128, 128, 128);
                      x += DrawSwatch(x, color) + DPI(3);
                  }
                  return;
              }

              w.DrawText(value_rect.left, y, FormatValueSummary(item), font, ink);
          }

          String PropertyEditor::FormatValueSummary'''
          editor = replace_once(
              editor,
              r'void PropertyEditor::DrawValueSummary\(Draw& w,.*?\n\}\n\nString PropertyEditor::FormatValueSummary',
              draw_block,
              'replace value summary')
          editor = editor.replace(
              '            Color c(item.value);\n            return Format("#%02X%02X%02X", c.GetR(), c.GetG(), c.GetB());',
              '            return String();')
          editor_path.write_text(editor, encoding='utf-8')

          theme_path = Path('Utilities/UiDesigner/Theme/UiDesignerThemeAdapter.cpp')
          theme = theme_path.read_text(encoding='utf-8-sig')

          theme = theme.replace(
          '''struct PanelThemeValues {
              Color face[4];
              Color frame[4];
              int frame_width;
              int radius;
              bool transparent;
          };''',
          '''struct PanelThemeValues {
              Color face[4];
              Color frame[4];
              bool frame_enabled;
              bool frame_dashed;
              String frame_dash_pattern;
              int frame_width;
              int radius;
              bool transparent;
          };''')

          theme = theme.replace(
              'v.frame_width = s.metrics.frame_width; v.radius = s.metrics.radius; v.transparent = s.transparent;',
              'v.frame_enabled = s.metrics.frame_enabled; v.frame_dashed = s.metrics.dashed; v.frame_dash_pattern = s.metrics.dash_pattern; v.frame_width = s.metrics.frame_width; v.radius = s.metrics.radius; v.transparent = s.transparent;')

          theme = theme.replace(
          '''        metrics.frame_enabled = style != "None";
                  metrics.dashed = style == "Dashed" || style == "Dotted";
                  return;''',
          '''        metrics.frame_enabled = style != "None";
                  metrics.dashed = style == "Dashed" || style == "Dotted";
                  if(style == "Dotted")
                      metrics.dash_pattern = "1,3";
                  else if(style == "Dashed")
                      metrics.dash_pattern = "5,5";
                  return;''')

          old_add = r'''        AddOverride(spec, "frame.style", "Style", "Frame",
                              PropertyEditorKind::Choice, "Solid",
                              PropertyImpactPaint | PropertyImpactCode, "frame.style");
                  spec.theme_overrides.Top().Choice("None", "None")
                      .Choice("Solid", "Solid")
                      .Choice("Dashed", "Dashed")
                      .Choice("Dotted", "Dotted")
                      .Choice("Custom", "Custom");'''
          new_add = r'''        const String default_frame_style = !b.frame_enabled ? "None" :
                      !b.frame_dashed ? "Solid" :
                      b.frame_dash_pattern == "1,3" ? "Dotted" : "Dashed";
                  AddOverride(spec, "frame.style", "Style", "Frame",
                              PropertyEditorKind::Choice, default_frame_style,
                              PropertyImpactPaint | PropertyImpactCode, "frame.style");
                  spec.theme_overrides.Top().Choice("None", "None")
                      .Choice("Solid", "Solid")
                      .Choice("Dashed", "Dashed")
                      .Choice("Dotted", "Dotted");'''
          if old_add not in theme:
              raise SystemExit('frame choices block not found')
          theme = theme.replace(old_add, new_add)

          skin_block = '''        AddOverride(spec, "skin", "Skin", "Skin",
                              PropertyEditorKind::Choice, "None",
                              PropertyImpactPaint | PropertyImpactCode, "skin");
                  spec.theme_overrides.Top().Choice("Image", "Image")
                      .Choice("NineSlice", "Nine-slice");
          '''
          if skin_block not in theme:
              raise SystemExit('skin block not found')
          theme = theme.replace(skin_block, '')
          theme = theme.replace(
              'AddOverride(spec, "radius", "Radius", "Surface", PropertyEditorKind::Integer, b.radius, PropertyImpactPaint | PropertyImpactCode, "radius");\n        AddOverride(spec, "transparent", "Transparent", "Surface", PropertyEditorKind::Boolean, b.transparent, PropertyImpactPaint | PropertyImpactCode, "transparent");',
              'AddOverride(spec, "radius", "Corner radius", "General", PropertyEditorKind::Integer, b.radius, PropertyImpactPaint | PropertyImpactCode, "radius");\n        AddOverride(spec, "transparent", "Transparent background", "General", PropertyEditorKind::Boolean, b.transparent, PropertyImpactPaint | PropertyImpactCode, "transparent");')
          theme = theme.replace(
              'return id.StartsWith("face.") || id.StartsWith("frame.") || id == "skin" || id == "radius" || id == "transparent";',
              'return id.StartsWith("face.") || id.StartsWith("frame.") || id == "radius" || id == "transparent";')
          theme = theme.replace(
              'if(id == "frame.style" || id == "frame.width" || id == "skin") {',
              'if(id == "frame.style" || id == "frame.width") {')
          theme = theme.replace(
              'if(id == "frame.style") return v.frame_width > 0 ? "Solid" : "None";\n            if(id == "frame.width") return v.frame_width;\n            return "None";',
              'if(id == "frame.style") return !v.frame_enabled ? "None" : !v.frame_dashed ? "Solid" : v.frame_dash_pattern == "1,3" ? "Dotted" : "Dashed";\n            return v.frame_width;')
          theme = theme.replace(
          '''                out << "\\t" << member << "_style.metrics.dashed = "
                              << (style == "Dashed" || style == "Dotted" ? "true" : "false") << ";\\n";
                          continue;''',
          '''                out << "\\t" << member << "_style.metrics.dashed = "
                              << (style == "Dashed" || style == "Dotted" ? "true" : "false") << ";\\n";
                          if(style == "Dotted")
                              out << "\\t" << member << "_style.metrics.dash_pattern = \\\"1,3\\\";\\n";
                          else if(style == "Dashed")
                              out << "\\t" << member << "_style.metrics.dash_pattern = \\\"5,5\\\";\\n";
                          continue;''')
          theme_path.write_text(theme, encoding='utf-8')

          checks = {
              'solid recipe uses solid field': 'mode == "Solid" ? "solid" : Key(index)' in value,
              'gradient remains available': 'UiDropdown::Item("Gradient", "QuadGradient", true)' in value,
              'image is explicitly unavailable': 'UiDropdown::Item("Image unavailable", "Image", false)' in value,
              'summary keeps mode visible': 'const String label = mode == "QuadGradient" ? "Gradient"' in editor,
              'colour summaries omit hex': 'return Format("#%02X%02X%02X"' not in editor,
              'panel skin row removed': 'AddOverride(spec, "skin"' not in theme,
              'general group is named': '"Corner radius", "General"' in theme,
              'dotted pattern is distinct': 'metrics.dash_pattern = "1,3"' in theme,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('contract checks failed: ' + ', '.join(failed))

          Path('.github/workflows/assistant-property-fill-polish.yml').unlink()
          PY

      - name: Review diff contracts
        shell: bash
        run: |
          git diff --check
