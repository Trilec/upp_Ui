name: UiDesigner load and preset drag correction

on:
  push:
    branches: [ agent/uidesigner-load-preset-drag ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uidesigner-load-preset-drag
          fetch-depth: 0
      - name: Apply correction
        run: |
          python3 .github/uidesigner-load-preset-drag.py
          git diff --check
          grep -q 'Dynamic menus rebuild their rows from WhenOpen' Ui/UiSplitButton.cpp
          grep -q 'ExecutePresetDrop' Utilities/UiDesigner/UiDesigner/UiDesignerHierarchyView.cpp
          grep -q 'type_id.StartsWith("preset:")' Utilities/UiDesigner/UiDesigner/UiDesignerInteractionOverlay.cpp
          ! grep -q 'pressed_ >= 0 && !presets_' Utilities/UiDesigner/UiDesigner/UiDesignerCatalogList.cpp
      - name: Publish correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UiDesigner restores dynamic Load and preset dragging"
          git push origin HEAD:main
          git push origin --delete agent/uidesigner-load-preset-drag
