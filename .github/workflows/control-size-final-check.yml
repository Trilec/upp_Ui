name: Final UiDesigner sizing profile check

on:
  push:
    branches:
      - assistant/control-size-profiles

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/control-size-profiles
          fetch-depth: 0

      - name: Verify profile coverage and clean test join
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          tests_path = Path('Utilities/UiDesigner/Tests/main.cpp')
          tests = tests_path.read_text(encoding='utf-8')
          old = ('    Check(!catalog.ApplySizingDefaults(legacy_sizing_document),\n'
                 '          "legacy sizing upgrade is idempotent");\n'
                 'ImageBuffer background_buffer(4, 2);')
          new = ('    Check(!catalog.ApplySizingDefaults(legacy_sizing_document),\n'
                 '          "legacy sizing upgrade is idempotent");\n\n'
                 '    ImageBuffer background_buffer(4, 2);')
          if tests.count(old) != 1:
              raise SystemExit('unexpected sizing-test/background boundary')
          tests_path.write_text(tests.replace(old, new, 1), encoding='utf-8')

          builtins = Path(
              'Utilities/UiDesigner/Catalog/UiDesignerBuiltins.cpp').read_text(
                  encoding='utf-8')
          profile_start = builtins.index('static const Entry profiles[] = {')
          profile_end = builtins.index('    };', profile_start)
          profile_block = builtins[profile_start:profile_end]
          profile_types = set(re.findall(
              r'\{"([A-Za-z0-9_]+)",\s*\d+,\s*\d+,\s*\d+,\s*\d+\}',
              profile_block))

          direct_types = set(re.findall(
              r'MakeSpec\(\s*"([A-Za-z0-9_]+)"', builtins))
          table_types = set(re.findall(
              r'\{"([A-Za-z0-9_]+)"(?:,\s*"[^"]*"){2,3},\s*'
              r'UiDesignerRuntimeKind::[A-Za-z0-9_]+', builtins))
          registered = direct_types | table_types
          registered -= {'UiAccordionSection', 'UiTabPage'}
          missing = sorted(registered - profile_types)
          extra = sorted(profile_types - registered)
          if missing:
              raise SystemExit('registered controls missing explicit profiles: ' +
                               ', '.join(missing))
          if extra:
              raise SystemExit('unused explicit sizing profiles: ' + ', '.join(extra))
          if len(profile_types) < 60:
              raise SystemExit(
                  f'profile table unexpectedly small: {len(profile_types)} entries')

          catalog = Path(
              'Utilities/UiDesigner/Catalog/UiDesignerCatalog.cpp').read_text(
                  encoding='utf-8')
          for marker in (
              '"width_mode", "Width mode", "Fit"',
              '"height_mode", "Height mode", "Fit"',
              '"cell_align_x", "Cell align X", "Center"',
              '"cell_align_y", "Cell align Y", "Center"',
          ):
              if catalog.count(marker) != 1:
                  raise SystemExit('common property marker count changed: ' + marker)

          Path('.github/workflows/control-size-final-check.yml').unlink()
          retry = Path('.github/workflows/control-size-final-check-retry.yml')
          if retry.exists():
              retry.unlink()
          PY

          git diff --check
          git status --short

      - name: Commit final check
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UiDesigner closes control sizing profile coverage" -m "Verify every registered non-semantic control, including composite registrations, has one explicit sizing profile and remove the final test formatting join." -m "Retain guards for the complete Width, Height and cell-alignment common property contract."
          git push origin HEAD:assistant/control-size-profiles
