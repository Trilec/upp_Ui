name: Assistant PropertyEditor audit correction

on:
  push:
    branches:
      - assistant/property-editor-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/property-editor-audit
          fetch-depth: 0

      - name: Apply audited editor and pane contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label, flags=re.S):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              return updated

          # Property schema: inline presentation is explicit and reusable.
          path = 'Utilities/PropertyEditorCore/PropertyEditorModel.h'
          text = read(path)
          text = replace_once(
              text,
              '    bool show_slider_toggle = false;\n    bool overrideable = false;',
              '    bool show_slider_toggle = false;\n    bool inline_editor = false;\n    bool overrideable = false;',
              'add inline editor state')
          text = replace_once(
              text,
              '    PropertyEditorItem& SetSliderToggle(bool on = true);\n};',
              '    PropertyEditorItem& SetSliderToggle(bool on = true);\n    PropertyEditorItem& SetInlineEditor(bool on = true);\n};',
              'declare inline editor setter')
          write(path, text)

          path = 'Utilities/PropertyEditorCore/PropertyEditorModel.cpp'
          text = read(path)
          text = replace_once(
              text,
              '    item.kind = kind;\n    item.value = value;',
              '    item.kind = kind;\n    item.inline_editor = kind == PropertyEditorKind::FillRecipe;\n    item.value = value;',
              'default FillRecipe inline presentation')
          text = replace_once(
              text,
              '''PropertyEditorItem& PropertyEditorItem::SetSliderToggle(bool on)
          {
              show_slider_toggle = on;
              return *this;
          }
          ''',
              '''PropertyEditorItem& PropertyEditorItem::SetSliderToggle(bool on)
          {
              show_slider_toggle = on;
              if(on && kind == PropertyEditorKind::Integer)
                  kind = PropertyEditorKind::NumericInt;
              else if(on && kind == PropertyEditorKind::Double)
                  kind = PropertyEditorKind::NumericDouble;
              return *this;
          }

          PropertyEditorItem& PropertyEditorItem::SetInlineEditor(bool on)
          {
              inline_editor = on;
              return *this;
          }
          ''',
              'make presentation setters canonical')
          write(path, text)

          # Keep all editor creation on the public factory path.
          path = 'Utilities/PropertyEditor/PropertyEditorBase.cpp'
          text = read(path)
          text = replace_once(
              text,
              '''One<PropertyValueEditor> CreatePropertyLiveFillRecipeEditor();
          One<PropertyValueEditor> CreatePropertyLiveNumericIntEditor();

          ''',
              '',
              'remove private editor factory declarations')
          text = regex_once(
              text,
              r'''One<PropertyValueEditor> PropertyEditor::CreateEditor\(
              const PropertyEditorItem& item\) const
          \{
              if\(item\.kind == PropertyEditorKind::FillRecipe\)
                  return CreatePropertyLiveFillRecipeEditor\(\);
              if\(item\.kind == PropertyEditorKind::NumericInt\)
                  return CreatePropertyLiveNumericIntEditor\(\);
              return GetFactory\(\)\.Create\(item\);
          \}''',
              '''One<PropertyValueEditor> PropertyEditor::CreateEditor(
              const PropertyEditorItem& item) const
          {
              return GetFactory().Create(item);
          }''',
              'route builtins through public factory')
          write(path, text)

          path = 'Utilities/PropertyEditor/PropertyEditorInline.cpp'
          text = read(path)
          text = replace_once(
              text,
              '''    return item.kind == PropertyEditorKind::FillRecipe &&
                     item.value_editable && item.enabled && !item.read_only;''',
              '''    return item.inline_editor && item.value_editable &&
                     item.enabled && !item.read_only;''',
              'use explicit inline presentation')
          write(path, text)

          # The view must not rewrite schema, ranges or labels.
          path = 'Utilities/PropertyEditor/PropertyEditorLayout.cpp'
          text = read(path)
          text = regex_once(
              text,
              r'''\n            // Theme metrics are non-negative authored values\..*?\n            if\(!item\.visible \|\| !MatchesFilter\(item\)\)''',
              '\n            if(!item.visible || !MatchesFilter(item))',
              'remove view-layer schema mutation')
          write(path, text)

          # Consolidate the live numeric and FillRecipe behavior into the
          # canonical factory-owned implementations.
          path = 'Utilities/PropertyEditor/PropertyValueEditors.cpp'
          text = read(path)
          text = replace_once(
              text,
              '''        toggle_.SetCustomStyle(UiTheme::ResolveButton(UiButtonRole::Subtle));
              toggle_.WhenAction = [=] {
                  slider_mode_ = !slider_mode_;''',
              '''        toggle_.SetCustomStyle(UiTheme::ResolveButton(UiButtonRole::Subtle));
              toggle_.Tip("Switch between numeric entry and slider");
              toggle_.WhenAction = [=] {
                  if(!bounded_)
                      return;
                  slider_mode_ = !slider_mode_;''',
              'guard numeric slider toggle')
          text = replace_once(
              text,
              '''        edit_.WhenChange = [=] {
                  if(!syncing_)
                      WhenPreview(edit_.GetData());
              };
              edit_.WhenCommit = [=] {
                  if(!syncing_)
                      WhenCommit(edit_.GetData());
              };
          }

              virtual void Configure(const PropertyEditorItem& item) override
              {
                  enabled_ = item.enabled && !item.read_only;''',
              '''        edit_.WhenChange = [=] {
                  if(syncing_)
                      return;
                  syncing_ = true;
                  if(!IsNull(edit_.GetData()))
                      slider_.SetValue((int)edit_.GetData());
                  syncing_ = false;
                  WhenPreview(edit_.GetData());
              };
              edit_.WhenCommit = [=] {
                  if(!syncing_)
                      WhenCommit(edit_.GetData());
              };
          }

              virtual void Configure(const PropertyEditorItem& item) override
              {
                  enabled_ = item.enabled && item.value_editable && !item.read_only;''',
              'synchronize numeric entry and slider')
          text = replace_once(
              text,
              '''        toggle_.Show(item.show_slider_toggle && bounded_);
              toggle_.Enable(enabled_);''',
              '''        toggle_.Show(item.show_slider_toggle && bounded_);
              toggle_.Enable(enabled_ && bounded_);''',
              'disable unavailable slider toggle')
          text = replace_once(
              text,
              '''        const int toggle_width = toggle_.IsShown() ? DPI(26) : 0;
              toggle_.SetRect(max(0, GetSize().cx - toggle_width), 0, toggle_width, GetSize().cy);
              const int width = max(0, GetSize().cx - toggle_width - DPI(4));''',
              '''        const int toggle_width = toggle_.IsShown() ? DPI(26) : 0;
              toggle_.SetRect(max(0, GetSize().cx - toggle_width), 0,
                              toggle_width, GetSize().cy);
              const int gap = toggle_width ? DPI(4) : 0;
              const int width = max(0, GetSize().cx - toggle_width - gap);''',
              'avoid empty numeric editor gap')

          fill_dialog = r'''    void ReadPicker(UiColorPicker& picker, int count)
              {
                  for(int i = 0; i < count; i++) {
                      const String key = count == 1 ? "solid" : Key(i);
                      recipe_.Set(key, picker.GetSlotColor(i));
                  }
                  UpdateVisible();
              }

              void OpenColorDialog(int index)
              {
                  const String mode = RecipeText("mode", "None");
                  const int count = mode == "QuadGradient" ? 4 : mode == "Solid" ? 1 : 0;
                  if(!enabled_ || mixed_ || index < 0 || index >= count)
                      return;

                  const ValueMap original = recipe_;
                  bool accepted = false;

                  class ColorDialog : public TopWindow {
                  public:
                      UiColorPicker picker;

                      explicit ColorDialog(int count)
                      {
                          Title(count == 1 ? "Fill colour" : "Gradient colours");
                          Sizeable().Zoomable();
                          SetRect(0, 0, DPI(720), DPI(520));
                          Add(picker.SizePos());
                          picker.SetSlotCount(count);
                          picker.SetAlphaEnabled(false);
                      }
                  } dlg(count);

                  for(int i = 0; i < count; i++) {
                      const String key = count == 1 ? "solid" : Key(i);
                      dlg.picker.SetSlotColor(
                          i, RecipeColor(key, Color(128, 128, 128)), false);
                  }
                  dlg.picker.SetActiveSlot(index);
                  dlg.picker.WhenChanging = [&] {
                      ReadPicker(dlg.picker, count);
                      WhenPreview(recipe_);
                  };
                  dlg.picker.WhenAccept = [&] {
                      ReadPicker(dlg.picker, count);
                      accepted = true;
                      dlg.AcceptBreak(IDOK);
                  };
                  dlg.picker.WhenCancel = [&] { dlg.RejectBreak(IDCANCEL); };
                  dlg.CenterOwner();
                  if(dlg.Run() == IDOK && accepted)
                      WhenCommit(recipe_);
                  else {
                      recipe_ = original;
                      UpdateVisible();
                      WhenPreview(recipe_);
                  }
              }
          '''
          text = regex_once(
              text,
              r'''    void OpenColorDialog\(int index\)
              \{.*?\n              \}

              UiDropdown mode_;''',
              fill_dialog + '\n              UiDropdown mode_;',
              'make FillRecipe picker atomic and multi-slot')
          write(path, text)

          # Remove the duplicate private editor implementations.
          advanced = Path('Utilities/PropertyEditor/PropertyAdvancedEditors.cpp')
          if not advanced.exists():
              raise SystemExit('PropertyAdvancedEditors.cpp missing before consolidation')
          advanced.unlink()
          path = 'Utilities/PropertyEditor/PropertyEditor.upp'
          text = read(path)
          text = replace_once(text, '    PropertyAdvancedEditors.cpp,\n', '',
                              'remove duplicate editor translation unit')
          write(path, text)

          # Canonical theme metadata now owns ranges and truthful vocabulary.
          path = 'Utilities/UiDesigner/Theme/UiDesignerThemeAdapter.cpp'
          text = read(path)
          text = replace_once(
              text,
              '        item.kind = PropertyEditorKind::Integer;\n        item.domain = PropertyEditorDomain::Theme;',
              '        item.kind = PropertyEditorKind::NumericInt;\n        item.domain = PropertyEditorDomain::Theme;',
              'make button metrics use typed numeric toggle')
          text = replace_once(
              text,
              '''        AddOverride(spec, "frame.width", "Width", "Frame",
                          PropertyEditorKind::NumericInt, b.frame_width,
                          PropertyImpactPaint | PropertyImpactCode, "frame.width");
                  AddOverride(spec, "radius", "Corner radius", "General", PropertyEditorKind::Integer, b.radius, PropertyImpactPaint | PropertyImpactCode, "radius");
                  AddOverride(spec, "transparent", "Transparent background", "General", PropertyEditorKind::Boolean, b.transparent, PropertyImpactPaint | PropertyImpactCode, "transparent");''',
              '''        AddOverride(spec, "frame.width", "Width", "Frame",
                          PropertyEditorKind::NumericInt, b.frame_width,
                          PropertyImpactPaint | PropertyImpactCode, "frame.width");
                  spec.theme_overrides.Top().Range(0, 20, 1);
                  AddOverride(spec, "radius", "Corner radius", "General",
                              PropertyEditorKind::NumericInt, b.radius,
                              PropertyImpactPaint | PropertyImpactCode, "radius");
                  spec.theme_overrides.Top().Range(0, 128, 1);
                  AddOverride(spec, "transparent", "No background", "General",
                              PropertyEditorKind::Boolean, b.transparent,
                              PropertyImpactPaint | PropertyImpactCode, "transparent",
                              "Suppress background painting. This is not an opacity value.");''',
              'give Panel metrics canonical metadata')
          write(path, text)

          # Right-side Inspector columns use the old middle width as their new
          # minimum, then advance in clear forty-pixel steps.
          path = 'Utilities/UiDesigner/UiDesigner/UiDesignerStyle.h'
          text = read(path)
          text = replace_once(
              text,
              '''    static int PanelWideWidth()        { return DPI(346); }
              static int DesignerToolbarHeight() { return DPI(63); }''',
              '''    static int PanelWideWidth()        { return DPI(346); }
              static int InspectorNormalWidth()  { return DPI(324); }
              static int InspectorMediumWidth()  { return DPI(364); }
              static int InspectorWideWidth()    { return DPI(404); }
              static int DesignerToolbarHeight() { return DPI(63); }''',
              'add right Inspector width profile')
          write(path, text)

          path = 'Utilities/UiDesigner/UiDesigner/UiDesignerWidgets.h'
          text = read(path)
          text = replace_once(
              text,
              '''    UiDesignerPaneWidth width_ = PANE_NORMAL;
              int active_section_ = 0;
              bool right_ = false;''',
              '''    UiDesignerPaneWidth width_ = PANE_NORMAL;
              int normal_width_ = UiDesignerStyleMetrics::PanelNormalWidth();
              int medium_width_ = UiDesignerStyleMetrics::PanelMediumWidth();
              int wide_width_ = UiDesignerStyleMetrics::PanelWideWidth();
              int active_section_ = 0;
              bool right_ = false;''',
              'store side-specific width profile')
          write(path, text)

          path = 'Utilities/UiDesigner/UiDesigner/UiDesignerWidgets.cpp'
          text = read(path)
          text = replace_once(
              text,
              '''UiDesignerSideColumn& UiDesignerSideColumn::RightColumn(bool on)
          {
              right_ = on;
              close_.SetIcon(on ? ICON_DESIGN_RIGHT_PANEL_CLOSE_48()
                                : ICON_DESIGN_LEFT_PANEL_CLOSE_48());
              return *this;
          }''',
              '''UiDesignerSideColumn& UiDesignerSideColumn::RightColumn(bool on)
          {
              right_ = on;
              normal_width_ = on ? UiDesignerStyleMetrics::InspectorNormalWidth()
                                 : UiDesignerStyleMetrics::PanelNormalWidth();
              medium_width_ = on ? UiDesignerStyleMetrics::InspectorMediumWidth()
                                 : UiDesignerStyleMetrics::PanelMediumWidth();
              wide_width_ = on ? UiDesignerStyleMetrics::InspectorWideWidth()
                               : UiDesignerStyleMetrics::PanelWideWidth();
              close_.SetIcon(on ? ICON_DESIGN_RIGHT_PANEL_CLOSE_48()
                                : ICON_DESIGN_LEFT_PANEL_CLOSE_48());
              return *this;
          }''',
              'apply right-side width profile')
          text = replace_once(
              text,
              '''    case PANE_NORMAL: return UiDesignerStyleMetrics::PanelNormalWidth();
              case PANE_MEDIUM: return UiDesignerStyleMetrics::PanelMediumWidth();
              case PANE_WIDE:   return UiDesignerStyleMetrics::PanelWideWidth();
              default:          return UiDesignerStyleMetrics::PanelNormalWidth();''',
              '''    case PANE_NORMAL: return normal_width_;
              case PANE_MEDIUM: return medium_width_;
              case PANE_WIDE:   return wide_width_;
              default:          return normal_width_;''',
              'read configured side width profile')
          write(path, text)

          path = 'Utilities/UiDesigner/UiDesigner/UiDesignerWindow.cpp'
          text = read(path)
          text = replace_once(text,
                              '    designer_right_.SetPaneWidth(PANE_MEDIUM);',
                              '    designer_right_.SetPaneWidth(PANE_NORMAL);',
                              'preserve 324px initial right width')
          write(path, text)

          # Regression checks for reusable inline presentation, schema
          # immutability, canonical Panel metrics and right width steps.
          path = 'Utilities/PropertyEditorTests/main.cpp'
          text = read(path)
          anchor = '''    Check(PropertyEditorFactory::Global().Create(*model.Find("curve")),
                    "curve editor created");

              String error;'''
          insert = '''    Check(PropertyEditorFactory::Global().Create(*model.Find("curve")),
                    "curve editor created");

              PropertyEditorModel presentation_model;
              ValueMap fill_recipe;
              fill_recipe.Set("mode", "Solid");
              fill_recipe.Set("solid", Color(10, 20, 30));
              PropertyEditorItem& fill_item = presentation_model.Add(
                  "fill", "Fill", PropertyEditorKind::FillRecipe, fill_recipe, "Appearance");
              Check(fill_item.inline_editor,
                    "FillRecipe opts into the reusable inline presentation contract");
              PropertyEditorItem& custom_inline = presentation_model.Add(
                  "custom-inline", "Custom inline", PropertyEditorKind::Custom,
                  "seed", "Appearance");
              custom_inline.custom_editor = "test-custom";
              custom_inline.SetInlineEditor();
              Check(custom_inline.inline_editor,
                    "custom editors can opt into the same inline presentation contract");
              PropertyEditorItem& signed_metric = presentation_model.AddInteger(
                  "offset", "Offset", 0, "Theme");
              signed_metric.SetDomain(PropertyEditorDomain::Theme)
                           .SetRange(-40, 40, 1)
                           .SetSliderToggle();
              Check(signed_metric.kind == PropertyEditorKind::NumericInt &&
                        (int)signed_metric.minimum == -40 &&
                        (int)signed_metric.maximum == 40,
                    "slider opt-in is schema-owned and preserves signed ranges");
              presentation_model.StructureChanged();
              PropertyEditor presentation_editor;
              presentation_editor.SetRect(0, 0, 360, 220);
              presentation_editor.SetModel(&presentation_model);
              Check((int)signed_metric.minimum == -40 &&
                        (int)signed_metric.maximum == 40,
                    "laying out PropertyEditor does not rewrite authored ranges");

              String error;'''
          text = replace_once(text, anchor, insert,
                              'add PropertyEditor presentation regressions')
          write(path, text)

          path = 'Utilities/UiDesigner/Tests/main.cpp'
          text = read(path)
          text = replace_once(
              text,
              '''    Check(panel_theme_spec && panel_theme_spec->FindThemeOverride("frame.style") &&
                        panel_theme_spec->FindThemeOverride("frame.width") &&
                        panel_theme_spec->FindThemeOverride("skin") &&
                        panel_theme_spec->FindThemeOverride("frame.normal"),
                    "UiPanel exposes shared frame style, width, per-state colors and separate skin");''',
              '''    Check(panel_theme_spec && panel_theme_spec->FindThemeOverride("frame.style") &&
                        panel_theme_spec->FindThemeOverride("frame.width") &&
                        panel_theme_spec->FindThemeOverride("skin") == nullptr &&
                        panel_theme_spec->FindThemeOverride("frame.normal"),
                    "UiPanel exposes shared frame style and width without a fake skin row");
              const UiDesignerThemeOverrideSpec *panel_frame_width = panel_theme_spec
                  ? panel_theme_spec->FindThemeOverride("frame.width") : nullptr;
              const UiDesignerThemeOverrideSpec *panel_radius = panel_theme_spec
                  ? panel_theme_spec->FindThemeOverride("radius") : nullptr;
              const UiDesignerThemeOverrideSpec *panel_background = panel_theme_spec
                  ? panel_theme_spec->FindThemeOverride("transparent") : nullptr;
              Check(panel_frame_width && panel_frame_width->kind == PropertyEditorKind::NumericInt &&
                        (int)panel_frame_width->minimum == 0 &&
                        (int)panel_frame_width->maximum == 20 &&
                        panel_radius && panel_radius->kind == PropertyEditorKind::NumericInt &&
                        (int)panel_radius->minimum == 0 &&
                        (int)panel_radius->maximum == 128,
                    "Panel width and radius publish bounded numeric-toggle metadata");
              Check(panel_background && panel_background->label == "No background" &&
                        panel_background->help.Find("not an opacity") >= 0,
                    "Panel background suppression uses truthful canonical vocabulary");

              UiDesignerSideColumn left_column;
              UiDesignerSideColumn right_column;
              right_column.RightColumn();
              left_column.SetPaneWidth(PANE_NORMAL);
              right_column.SetPaneWidth(PANE_NORMAL);
              Check(left_column.GetDesiredWidth() == UiDesignerStyleMetrics::PanelNormalWidth(),
                    "left catalog column keeps its existing compact width profile");
              Check(right_column.GetDesiredWidth() == UiDesignerStyleMetrics::InspectorNormalWidth(),
                    "right Inspector minimum is the former middle width");
              right_column.SetPaneWidth(PANE_MEDIUM);
              Check(right_column.GetDesiredWidth() == UiDesignerStyleMetrics::InspectorMediumWidth(),
                    "right Inspector medium width is forty pixels larger");
              right_column.SetPaneWidth(PANE_WIDE);
              Check(right_column.GetDesiredWidth() == UiDesignerStyleMetrics::InspectorWideWidth(),
                    "right Inspector wide width is another forty pixels larger");''',
              'update Panel and width audit regressions')
          write(path, text)

          path = 'Utilities/PropertyEditor/README.md'
          text = read(path)
          text = replace_once(
              text,
              '- one active value editor at a time rather than one permanent control per row;\n',
              '- summary-on-idle rows by default, with explicit reusable inline editors for compact compound values;\n',
              'document inline presentation contract')
          text = replace_once(
              text,
              '- Custom factory editor\n',
              '- Custom factory editor\n- Fill recipe with persistent Solid/Gradient controls and atomic one-/four-colour editing\n',
              'document FillRecipe editor')
          text += '''

## Inline editor presentation

`FillRecipe` items opt into inline presentation automatically. Any custom item can use the same stable-row interaction with `SetInlineEditor()`. Inline presentation changes only how the editor is hosted; preview, commit, validation, reset and ownership remain on the normal `PropertyEditorModel` path.

Numeric slider toggles are schema-owned. Use `SetRange(...)` followed by `SetSliderToggle()`; the model promotes integer or double kinds to their typed numeric counterpart without inventing or clamping ranges in the view.
'''
          write(path, text)

          # Source-level acceptance guards.
          assert not Path('Utilities/PropertyEditor/PropertyAdvancedEditors.cpp').exists()
          assert 'PropertyAdvancedEditors.cpp' not in read('Utilities/PropertyEditor/PropertyEditor.upp')
          assert 'Theme metrics are non-negative authored values' not in read('Utilities/PropertyEditor/PropertyEditorLayout.cpp')
          assert 'item.inline_editor' in read('Utilities/PropertyEditor/PropertyEditorInline.cpp')
          assert 'SetSlotCount(count)' in read('Utilities/PropertyEditor/PropertyValueEditors.cpp')
          assert 'InspectorNormalWidth()  { return DPI(324); }' in read('Utilities/UiDesigner/UiDesigner/UiDesignerStyle.h')
          assert 'InspectorMediumWidth()  { return DPI(364); }' in read('Utilities/UiDesigner/UiDesigner/UiDesignerStyle.h')
          assert 'InspectorWideWidth()    { return DPI(404); }' in read('Utilities/UiDesigner/UiDesigner/UiDesignerStyle.h')
          assert '"No background"' in read('Utilities/UiDesigner/Theme/UiDesignerThemeAdapter.cpp')
          PY

      - name: Verify source hygiene
        shell: bash
        run: |
          git diff --check
          test ! -e Utilities/PropertyEditor/PropertyAdvancedEditors.cpp
          grep -q 'inline_editor' Utilities/PropertyEditorCore/PropertyEditorModel.h
          grep -q 'SetSlotCount(count)' Utilities/PropertyEditor/PropertyValueEditors.cpp
          grep -q 'InspectorWideWidth()    { return DPI(404); }' Utilities/UiDesigner/UiDesigner/UiDesignerStyle.h

      - name: Commit audited correction
        shell: bash
        run: |
          git config user.name 'OpenAI Assistant'
          git config user.email 'openai-assistant@users.noreply.github.com'
          git rm -f .github/workflows/assistant-property-editor-audit.yml .audit-trigger 2>/dev/null || true
          git add -A
          git commit -m 'PropertyEditor makes live rows a reusable schema contract' -m 'Replace FillRecipe-only hosting and view-time schema mutation with explicit inline presentation, canonical numeric ranges and one factory-owned editor implementation. Keep Panel face recipes atomic while making width, radius and background suppression truthful model metadata. Give right-side Inspector columns 324, 364 and 404 pixel width steps while leaving the left catalog profile unchanged. Add regression coverage for inline custom editors, signed numeric ranges, Panel metadata and side-column widths.'
          git push origin HEAD:assistant/property-editor-audit
