name: UiDesigner focused acceptance correction

on:
  push:
    branches: [ main ]
    paths:
      - .github/uidesigner-focused-acceptance.py.gz.b64
      - .github/workflows/uidesigner-focused-acceptance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused acceptance correction
        shell: bash
        run: |
          base64 -d .github/uidesigner-focused-acceptance.py.gz.b64 | gzip -d > /tmp/fix.py
          python3 /tmp/fix.py
          git diff --check
          ! grep -n 'h_sizing\|v_sizing' Utilities/UiDesigner/Services/UiDesignerSession.cpp | grep dialog_action_spacer
          grep -n 'CycleSizingMode(id, height' Utilities/UiDesigner/UiDesigner/UiDesignerWindow.cpp
          grep -n 'property == "direction" || property == "wrap"' Utilities/UiDesigner/Preview/UiDesignerPreview.cpp
          rm -f .github/uidesigner-focused-acceptance.py.gz.b64
          rm -f .github/workflows/uidesigner-focused-acceptance.yml
      - name: Commit and publish correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UiDesigner corrects dialog actions and sizing commands"
          git push origin main
