name: Fix UiDesigner Tab content-gap dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/uidesigner-tab-content-gap.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply corrected binary payload
        shell: bash
        run: |
          mkdir -p Utilities/UiDesigner/tools
          gzip -d -c .github/uidesigner-tab-content-gap.py.gz > Utilities/UiDesigner/tools/fix_tab_content_gap.py
          python3 -m py_compile Utilities/UiDesigner/tools/fix_tab_content_gap.py
          python3 Utilities/UiDesigner/tools/fix_tab_content_gap.py

      - name: Verify and publish
        shell: bash
        run: |
          rm -rf Utilities/UiDesigner/tools
          rm -f .github/uidesigner-tab-content-gap.py.gz
          rm -f .github/workflows/uidesigner-tab-content-gap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git diff --check
          grep -q '!dynamic_cast<UiTab \*>(&ctrl)' Utilities/UiDesigner/Preview/UiDesignerPreview.cpp
          grep -q 'Generated UiTab routes content gap through UiTab::Style only' Utilities/UiDesigner/RegressionTests/main.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UiDesigner routes Tab content gap through its style"
          git push origin HEAD:main
