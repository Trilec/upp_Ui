name: UiDesigner preset and legacy migration

on:
  push:
    branches: [ agent/uidesigner-presets-legacy-rc ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uidesigner-presets-legacy-rc
          fetch-depth: 0
      - name: Apply migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/uidesigner-presets-legacy-rc.py')
          s = p.read_text()
          old = "pattern = re.compile(r'(?:\\s*catalog\\.RegisterPreset\\(UiDesignerPreset\\{.*?\\}\\);)+', re.S)\nbuiltins, count = pattern.subn(preset_block.rstrip(), builtins, count=1)"
          new = "pattern = re.compile(r'static void RegisterPresets\\(UiDesignerCatalog& catalog\\)\\n\\{.*?\\n\\}', re.S)\nreplacement = 'static void RegisterPresets(UiDesignerCatalog& catalog)\\n{\\n' + preset_block.rstrip() + '\\n}'\nbuiltins, count = pattern.subn(replacement, builtins, count=1)"
          if old not in s:
              raise SystemExit('preset migration pattern not found')
          p.write_text(s.replace(old, new))
          PY
          python3 .github/uidesigner-presets-legacy-rc.py
          git diff --check
          grep -q 'InsertPreset' Utilities/UiDesigner/Services/UiDesignerSession.cpp
          grep -q 'HolyGrail' Utilities/UiDesigner/Services/UiDesignerPresets.cpp
          grep -q 'explicit-children' Utilities/UiDesigner/Core/UiDesignerSerialization.cpp
      - name: Publish clean source commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UiDesigner restores composable presets and legacy order"
          git push origin HEAD:main
          git push origin --delete agent/uidesigner-presets-legacy-rc
