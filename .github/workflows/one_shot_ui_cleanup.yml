name: One-shot Ui source cleanup

on:
  push:
    paths:
      - tools/one_shot_ui_cleanup.py
      - .github/workflows/one_shot_ui_cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restructure Ui sources
        run: python tools/one_shot_ui_cleanup.py
      - name: Check diff hygiene
        run: git diff --check
      - name: Commit generated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes produced"
            exit 1
          fi
          git commit -m "Restructure ColorPicker and retire UiComposites" -m "Move the large ColorPicker implementation into Ui/ColorPicker, expand and remove all numbered .inc fragments, remove Ui/Composites from the production package, and keep legacy demo-row conveniences demo-only until the canonical PropertyEditor demo migration."
          git push origin HEAD:main
