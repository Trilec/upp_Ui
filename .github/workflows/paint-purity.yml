name: Paint Purity

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  paint-purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run paint purity guard
        run: python3 scripts/check_paint_purity.py
