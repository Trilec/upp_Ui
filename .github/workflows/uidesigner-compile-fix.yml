name: UiDesigner compile correction

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    if: github.event.head_commit.message == 'Run UiDesigner compile correction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply correction
        run: |
          python3 .github/uidesigner-compile-fix.py
          git diff --check
          grep -q 'const String status = ok' Utilities/UiDesigner/UiDesigner/UiDesignerHierarchyView.cpp
      - name: Publish correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UiDesigner fixes preset drop status compile"
          git push origin main
