name: Repair UiDesigner control size contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'assistant/control-size-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/control-size-profiles
          fetch-depth: 0

      - name: Restore and verify sizing contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          catalog_path = Path('Utilities/UiDesigner/Catalog/UiDesignerCatalog.cpp')
          catalog = catalog_path.read_text(encoding='utf-8')

          common_function = '\n'.join([
              'void AddUiDesignerCommonProperties(UiDesignerControlSpec& spec)',
              '{',
              '    UiDesignerPropertySpec name;',
              '    name.id = "name";',
              '    name.label = "Name";',
              '    name.group = "Identity";',
              '    name.kind = PropertyEditorKind::Text;',
              '    name.domain = PropertyEditorDomain::DesignerOnly;',
              '    name.default_value = spec.default_base_name;',
              '    name.impact = PropertyImpactCode | PropertyImpactSelection;',
              '    name.designer_only = true;',
              '    spec.properties.Add(pick(name));',
              '',
              '    UiDesignerPropertySpec visible = UiDesignerBoolProperty(',
              '        "visible", "Visible", true);',
              '    visible.group = "Behaviour";',
              '    spec.properties.Add(pick(visible));',
              '',
              '    UiDesignerPropertySpec enabled = UiDesignerBoolProperty(',
              '        "enabled", "Enabled", true);',
              '    enabled.group = "Behaviour";',
              '    spec.properties.Add(pick(enabled));',
              '',
              '    const struct {',
              '        const char *id;',
              '        const char *label;',
              '        const char *value;',
              '    } modes[] = {',
              '        {"width_mode", "Width mode", "Fit"},',
              '        {"height_mode", "Height mode", "Fit"},',
              '        {"cell_align_x", "Cell align X", "Center"},',
              '        {"cell_align_y", "Cell align Y", "Center"},',
              '    };',
              '    for(const auto& field : modes) {',
              '        UiDesignerPropertySpec property;',
              '        property.id = field.id;',
              '        property.label = field.label;',
              '        property.group = "Layout";',
              '        property.kind = PropertyEditorKind::Choice;',
              '        property.domain = PropertyEditorDomain::Layout;',
              '        property.default_value = field.value;',
              "        if(field.id[0] == 'w' || field.id[0] == 'h')",
              '            property.Choice("Fit", "Fit").Choice("Fixed", "Fixed")',
              '                     .Choice("Expand", "Expand");',
              '        else if(String(field.id) == "cell_align_x")',
              '            property.Choice("Left", "Left")',
              '                     .Choice("Center", "Center").Choice("Right", "Right");',
              '        else',
              '            property.Choice("Top", "Top")',
              '                     .Choice("Center", "Center").Choice("Bottom", "Bottom");',
              '        property.impact = PropertyImpactLocalLayout |',
              '                          PropertyImpactAncestorLayout | PropertyImpactCode;',
              '        spec.properties.Add(property);',
              '        spec.defaults.Set(field.id, field.value);',
              '    }',
              '',
              '    const struct {',
              '        const char *id;',
              '        const char *label;',
              '        int default_value;',
              '        int minimum_value;',
              '    } sizes[] = {',
              '        {"fixed_width", "Fixed width", max(1, spec.default_size.cx), 1},',
              '        {"fixed_height", "Fixed height", max(1, spec.default_size.cy), 1},',
              '        {"min_width", "Min width", max(1, spec.minimum_size.cx), 1},',
              '        {"min_height", "Min height", max(1, spec.minimum_size.cy), 1},',
              '        {"max_width", "Max width", 0, 0},',
              '        {"max_height", "Max height", 0, 0},',
              '    };',
              '    for(const auto& field : sizes) {',
              '        UiDesignerPropertySpec property = UiDesignerNumberProperty(',
              '            field.id, field.label, field.default_value,',
              '            field.minimum_value, 10000, 1,',
              '            PropertyEditorKind::Integer);',
              '        property.group = "Layout";',
              '        property.domain = PropertyEditorDomain::Layout;',
              '        property.impact = PropertyImpactLocalLayout |',
              '                          PropertyImpactAncestorLayout | PropertyImpactCode;',
              '        spec.properties.Add(property);',
              '        spec.defaults.Set(field.id, field.default_value);',
              '    }',
              '',
              '    UiDesignerPropertySpec role;',
              '    role.id = "role";',
              '    role.label = "Role";',
              '    role.group = "Appearance";',
              '    role.kind = PropertyEditorKind::Choice;',
              '    role.domain = PropertyEditorDomain::Theme;',
              '    role.default_value = "Standard";',
              '    role.impact = PropertyImpactPaint |',
              '                  PropertyImpactThemeGlobal |',
              '                  PropertyImpactCode;',
              '    role.Choice("Standard", "Standard")',
              '        .Choice("Subtle", "Subtle")',
              '        .Choice("Accent", "Accent")',
              '        .Choice("Alert", "Alert");',
              '    spec.properties.Add(pick(role));',
              '}',
          ])
          function_start = catalog.index(
              'void AddUiDesignerCommonProperties(UiDesignerControlSpec& spec)')
          function_tail = catalog.rfind('\n}\n\n}')
          if function_tail < function_start:
              raise SystemExit('unable to locate complete common-property function')
          function_end = function_tail + 2
          catalog = (catalog[:function_start] + common_function +
                     catalog[function_end:])

          validation_lines = [
              '        if(!spec.IsSemanticItem()) {',
              '            if(spec.default_size.cx <= 0 || spec.default_size.cy <= 0) {',
              '                error = spec.type_id + " has a non-positive natural size";',
              '                return false;',
              '            }',
              '            if(spec.minimum_size.cx <= 0 || spec.minimum_size.cy <= 0) {',
              '                error = spec.type_id + " has a non-positive minimum size";',
              '                return false;',
              '            }',
              '            if(spec.minimum_size.cx > spec.default_size.cx ||',
              '               spec.minimum_size.cy > spec.default_size.cy) {',
              '                error = spec.type_id + " minimum size exceeds its natural size";',
              '                return false;',
              '            }',
              '',
              '            const UiDesignerPropertySpec* fixed_width =',
              '                spec.FindProperty("fixed_width");',
              '            const UiDesignerPropertySpec* fixed_height =',
              '                spec.FindProperty("fixed_height");',
              '            const UiDesignerPropertySpec* min_width =',
              '                spec.FindProperty("min_width");',
              '            const UiDesignerPropertySpec* min_height =',
              '                spec.FindProperty("min_height");',
              '            const UiDesignerPropertySpec* max_width =',
              '                spec.FindProperty("max_width");',
              '            const UiDesignerPropertySpec* max_height =',
              '                spec.FindProperty("max_height");',
              '            if(!fixed_width || !fixed_height || !min_width || !min_height ||',
              '               !max_width || !max_height) {',
              '                error = spec.type_id + " is missing common sizing properties";',
              '                return false;',
              '            }',
              '',
              '            const auto DefaultInt = [&](const char *field) {',
              '                const int q = spec.defaults.Find(field);',
              '                return q >= 0 ? (int)spec.defaults.GetValue(q) : -1;',
              '            };',
              '            if(DefaultInt("fixed_width") != spec.default_size.cx ||',
              '               DefaultInt("fixed_height") != spec.default_size.cy) {',
              '                error = spec.type_id + " Fixed defaults do not match natural size";',
              '                return false;',
              '            }',
              '            if(DefaultInt("min_width") != spec.minimum_size.cx ||',
              '               DefaultInt("min_height") != spec.minimum_size.cy) {',
              '                error = spec.type_id + " minimum defaults do not match minimum size";',
              '                return false;',
              '            }',
              '            if(DefaultInt("max_width") != 0 || DefaultInt("max_height") != 0) {',
              '                error = spec.type_id + " maximum defaults must remain unbounded";',
              '                return false;',
              '            }',
              '            if((int)fixed_width->minimum != 1 ||',
              '               (int)fixed_height->minimum != 1 ||',
              '               (int)min_width->minimum != 1 ||',
              '               (int)min_height->minimum != 1 ||',
              '               (int)max_width->minimum != 0 ||',
              '               (int)max_height->minimum != 0) {',
              '                error = spec.type_id + " has an invalid sizing input range";',
              '                return false;',
              '            }',
              '        }',
              '        if(spec.preview_adapter_id.IsEmpty()) {',
          ]
          validate_start = catalog.index('bool UiDesignerCatalog::Validate(String& error) const')
          block_start = catalog.index('        if(!spec.IsSemanticItem()) {', validate_start)
          preview_start = catalog.index('if(spec.preview_adapter_id.IsEmpty()) {', block_start)
          preview_end = preview_start + len('if(spec.preview_adapter_id.IsEmpty()) {')
          catalog = (catalog[:block_start] + '\n'.join(validation_lines) +
                     catalog[preview_end:])
          catalog_path.write_text(catalog, encoding='utf-8')

          tests_path = Path('Utilities/UiDesigner/Tests/main.cpp')
          tests = tests_path.read_text(encoding='utf-8')
          test_lines = [
              '    auto DefaultSizeValue = [](const UiDesignerControlSpec& spec,',
              '                               const char *field) {',
              '        const int q = spec.defaults.Find(field);',
              '        return q >= 0 ? (int)spec.defaults.GetValue(q) : -1;',
              '    };',
              '    for(const UiDesignerControlSpec& spec : catalog.GetControls()) {',
              '        if(spec.IsSemanticItem())',
              '            continue;',
              '        Check(spec.default_size.cx > 0 && spec.default_size.cy > 0,',
              '              spec.type_id + " has a visible natural size");',
              '        Check(spec.minimum_size.cx > 0 && spec.minimum_size.cy > 0 &&',
              '                  spec.minimum_size.cx <= spec.default_size.cx &&',
              '                  spec.minimum_size.cy <= spec.default_size.cy,',
              '              spec.type_id + " has a usable minimum size");',
              '        Check(DefaultSizeValue(spec, "fixed_width") == spec.default_size.cx &&',
              '                  DefaultSizeValue(spec, "fixed_height") == spec.default_size.cy,',
              '              spec.type_id + " Fixed mode starts from its natural size");',
              '        Check(DefaultSizeValue(spec, "min_width") == spec.minimum_size.cx &&',
              '                  DefaultSizeValue(spec, "min_height") == spec.minimum_size.cy,',
              '              spec.type_id + " minimum fields use its visible minimum");',
              '        Check(DefaultSizeValue(spec, "max_width") == 0 &&',
              '                  DefaultSizeValue(spec, "max_height") == 0,',
              '              spec.type_id + " keeps zero only for unbounded maximums");',
              '        const UiDesignerPropertySpec* fixed_width =',
              '            spec.FindProperty("fixed_width");',
              '        const UiDesignerPropertySpec* fixed_height =',
              '            spec.FindProperty("fixed_height");',
              '        const UiDesignerPropertySpec* min_width =',
              '            spec.FindProperty("min_width");',
              '        const UiDesignerPropertySpec* min_height =',
              '            spec.FindProperty("min_height");',
              '        Check(fixed_width && fixed_height && min_width && min_height &&',
              '                  (int)fixed_width->minimum == 1 &&',
              '                  (int)fixed_height->minimum == 1 &&',
              '                  (int)min_width->minimum == 1 &&',
              '                  (int)min_height->minimum == 1,',
              '              spec.type_id + " cannot author zero fixed/minimum dimensions");',
              '    }',
              '',
              '    auto CheckSizeProfile = [&](const char *type, Size natural,',
              '                                Size minimum) {',
              '        const UiDesignerControlSpec* spec = catalog.Find(type);',
              '        Check(spec && spec->default_size == natural &&',
              '                  spec->minimum_size == minimum,',
              '              String(type) + " has its expected sizing profile");',
              '    };',
              '    CheckSizeProfile("UiButton", Size(80, 25), Size(50, 25));',
              '    CheckSizeProfile("UiToolButton", Size(25, 25), Size(25, 25));',
              '    CheckSizeProfile("UiLabel", Size(100, 25), Size(40, 20));',
              '    CheckSizeProfile("UiSlider", Size(160, 25), Size(80, 20));',
              '    CheckSizeProfile("UiMultiEdit", Size(190, 90), Size(100, 50));',
              '    CheckSizeProfile("UiColorPicker", Size(480, 360), Size(320, 240));',
              '    CheckSizeProfile("UiGroupPanel", Size(280, 160), Size(100, 70));',
              '    CheckSizeProfile("UppVScrollBar", Size(18, 160), Size(16, 80));',
              '',
              '    UiDesignerSession sizing_session;',
              '    const UiDesignerNodeId sizing_button =',
              '        sizing_session.AddControl("UiButton");',
              '    const UiDesignerNode* sizing_button_node =',
              '        sizing_session.Document().Find(sizing_button);',
              '    Check(sizing_button_node &&',
              '              (int)sizing_button_node->GetProperty("fixed_width", 0) == 80 &&',
              '              (int)sizing_button_node->GetProperty("fixed_height", 0) == 25 &&',
              '              (int)sizing_button_node->GetProperty("min_width", 0) == 50 &&',
              '              (int)sizing_button_node->GetProperty("min_height", 0) == 25,',
              '          "new Button stores its natural and minimum sizing profile");',
              '    Check(sizing_session.InspectorModel().Find("fixed_width") &&',
              '              (int)sizing_session.InspectorModel().Find("fixed_width")->value == 80 &&',
              '              sizing_session.InspectorModel().Find("min_width") &&',
              '              (int)sizing_session.InspectorModel().Find("min_width")->value == 50,',
              '          "Button Inspector presents non-zero sizing values immediately");',
              '    String sizing_error;',
              '    Check(sizing_session.CommitProperty("width_mode", "Fixed", sizing_error),',
              '          "Button width mode switches to Fixed: " + sizing_error);',
              '    Check(sizing_session.CommitProperty("fixed_width", 120, sizing_error),',
              '          "Button Fixed width can be edited: " + sizing_error);',
              '    Check(sizing_session.ResetProperty("fixed_width", sizing_error) &&',
              '              (int)sizing_session.Document().Find(sizing_button)',
              '                  ->GetProperty("fixed_width", 0) == 80,',
              '          "Button Fixed width reset returns to natural width: " + sizing_error);',
              '',
              '    UiDesignerDocument legacy_sizing_document;',
              '    legacy_sizing_document.NewDocument();',
              '    UiDesignerCommandService legacy_sizing_commands(legacy_sizing_document);',
              '    const UiDesignerControlSpec* legacy_button_spec =',
              '        catalog.Find("UiButton");',
              '    Check(legacy_button_spec != nullptr,',
              '          "legacy sizing fixture resolves the Button specification");',
              '    ValueMap legacy_button_defaults;',
              '    dword legacy_button_flags = UiDesignerNodeNone;',
              '    if(legacy_button_spec) {',
              '        legacy_button_defaults = legacy_button_spec->defaults;',
              '        legacy_button_flags = legacy_button_spec->node_flags;',
              '    }',
              '    const UiDesignerNodeId legacy_button = legacy_sizing_commands.AddNode(',
              '        "UiButton", "legacy_button", legacy_sizing_document.GetRootId(),',
              '        legacy_button_flags, legacy_button_defaults, "Add legacy button");',
              '    UiDesignerNode* legacy_button_node =',
              '        legacy_sizing_document.Find(legacy_button);',
              '    if(legacy_button_node) {',
              '        legacy_button_node->SetProperty("fixed_width", 0);',
              '        legacy_button_node->SetProperty("fixed_height", 0);',
              '        legacy_button_node->SetProperty("min_width", 0);',
              '        legacy_button_node->SetProperty("min_height", 0);',
              '    }',
              '    Check(catalog.ApplySizingDefaults(legacy_sizing_document),',
              '          "legacy zero sizing values are upgraded");',
              '    legacy_button_node = legacy_sizing_document.Find(legacy_button);',
              '    Check(legacy_button_node &&',
              '              (int)legacy_button_node->GetProperty("fixed_width", 0) == 80 &&',
              '              (int)legacy_button_node->GetProperty("fixed_height", 0) == 25 &&',
              '              (int)legacy_button_node->GetProperty("min_width", 0) == 50 &&',
              '              (int)legacy_button_node->GetProperty("min_height", 0) == 25 &&',
              '              (int)legacy_button_node->GetProperty("max_width", 0) == 0 &&',
              '              (int)legacy_button_node->GetProperty("max_height", 0) == 0,',
              '          "legacy Button receives its profile without bounding maximums");',
              '    Check(!catalog.ApplySizingDefaults(legacy_sizing_document),',
              '          "legacy sizing upgrade is idempotent");',
              '',
          ]
          tests_start = tests.index('    auto DefaultSizeValue = [](')
          image_start = tests.index('    ImageBuffer background_buffer(4, 2);', tests_start)
          tests = tests[:tests_start] + '\n'.join(test_lines) + tests[image_start:]
          tests_path.write_text(tests, encoding='utf-8')

          repaired_catalog = catalog_path.read_text(encoding='utf-8')
          required_common = [
              '"width_mode", "Width mode", "Fit"',
              '"height_mode", "Height mode", "Fit"',
              '"cell_align_x", "Cell align X", "Center"',
              '"cell_align_y", "Cell align Y", "Center"',
          ]
          for marker in required_common:
              if repaired_catalog.count(marker) != 1:
                  raise SystemExit('missing or duplicate common sizing marker: ' + marker)
          if repaired_catalog.count('void AddUiDesignerCommonProperties') != 1:
              raise SystemExit('common-property function count changed')

          Path('.github/workflows/control-size-final-repair.yml').unlink()
          PY

          git diff --check
          git status --short

      - name: Commit repaired contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UiDesigner restores the complete common sizing contract" -m "Restore Width mode, Height mode and cell alignment after the sizing-profile refactor, and keep the common property definition canonical and consistently formatted." -m "Exercise the actual Button Inspector, Fixed-mode edit and reset route in addition to exhaustive profile and legacy migration checks."
          git push origin HEAD:assistant/control-size-profiles
