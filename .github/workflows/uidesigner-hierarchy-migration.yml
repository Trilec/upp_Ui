name: UiDesigner hierarchy migration

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/uidesigner-hierarchy-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply model-backed UiTree migration
        shell: bash
        run: |
          git show db170234e488ce3cbb22e7da4f6d2f311e70d4d1:.github/uidesigner-hierarchy-migration.py.gz.b64 > /tmp/migration.b64
          base64 -d /tmp/migration.b64 | gzip -d > /tmp/migrate.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/migrate.py')
          s = p.read_text()
          s = s.replace(
              "r'(void UiTree::MouseMove\\(Point p, dword flags\\)\\n\\{\\n    SyncModel\\(\\);\\n)',",
              "r'(void UiTree::MouseMove\\(Point p, dword\\)\\n\\{\\n)',")
          s = s.replace("r'''\\1\\n    int tip_row = HitTestRow(p);", "r'''\\1    int tip_row = HitTestRow(p);")
          s = s.replace('UiTheme::ResolveTree(UiRole::Subtle)', 'UiTheme::ResolveTree()')
          s = s.replace('SetRootVisible(true)', 'SetRootVisible(false)')
          p.write_text(s)
          PY
          python3 /tmp/migrate.py
          rm -f .github/uidesigner-hierarchy-migration.py.gz.b64
          rm -f .github/uidesigner-hierarchy-migration.part*
          rm -f .github/workflows/uidesigner-hierarchy-migration.yml
          git diff --check
          grep -R "HierarchyTree : public UiTree" Utilities/UiDesigner/UiDesigner/UiDesignerWidgets.h
          grep -R "EnableInternalMutation(false)" Utilities/UiDesigner/UiDesigner/UiDesignerHierarchyView.cpp
          ! grep -R "Vector<Row> rows_" Utilities/UiDesigner/UiDesigner/UiDesignerWidgets.h
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UiDesigner switches hierarchy to model-backed UiTree"
          git push origin main
